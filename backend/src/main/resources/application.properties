spring.application.name=AttendEase
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:${DB_ENGINE:mysql}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendease}}
spring.datasource.username=${DB_USERNAME:attend_user}
spring.datasource.password=${DB_PASSWORD:change_me_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
